# Build and deploy Node.js backend to Azure Web App

name: Build and deploy backend to Azure Web App - techversebackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          cd Backend
          npm install

      - name: Build (if needed)
        run: |
          cd Backend
          npm run build --if-present

      - name: Archive production artifact
        run: |
          cd Backend
          zip -r ../backend.zip .
        shell: bash

      - name: Upload artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: backend-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D0BF916C71A84162A06C57A2A4388EB3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A217EF8D98554D22AFF3877A942CBCDC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C54FFA5327F74E3E856A51F5ADA85D1E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'techversebackend'
          package: backend.zip


